# Автообновление статистики: скрейпинг -> парсинг -> data.json -> GitHub Pages.
# Внимание: папка .github должна лежать в корне репозитория. Если проект frpoker/
# сам является корнем репозитория — всё уже на месте.
name: update-stats

on:
  schedule:
    # три запуска после типичного окна публикации результатов (МСК = UTC+3)
    - cron: "0 21 * * *"   # 00:00 МСК
    - cron: "0 22 * * *"   # 01:00 МСК
    - cron: "0 23 * * *"   # 02:00 МСК
  workflow_dispatch: {}      # ручной запуск из интерфейса GitHub
  push:
    branches: [main]         # передеплой сайта при изменениях кода

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Scrape, parse, aggregate
        run: |
          python scraper.py
          python parser.py
          python aggregate.py

      # данные не коммитим: сайт собирается заново при каждом запуске,
      # а коммиты бота создавали конфликты с локальной копией

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
