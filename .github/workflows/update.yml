# Автообновление статистики: скрейпинг -> парсинг -> data.json -> GitHub Pages.
name: update-stats

on:
  schedule:
    # Время в cron — UTC; МСК = UTC+3.
    #
    # Среда / четверг / пятница (после игр):
    #   23:00–01:00 МСК каждые 10 мин, плюс 02:00 и 03:00 МСК
    - cron: "*/10 20-21 * * 3,4,5"  # 23:00–00:50 МСК
    - cron: "0 22 * * 3,4,5"        # 01:00 МСК
    - cron: "0 23 * * 3,4,5"        # 02:00 МСК
    - cron: "0 0 * * 4,5,6"         # 03:00 МСК (чт/пт/сб)
    #
    # Воскресенье:
    #   22:00–00:00 МСК каждые 10 мин, плюс 01:00 и 02:00 МСК
    - cron: "*/10 19-20 * * 0"      # 22:00–23:50 МСК
    - cron: "0 21-23 * * 0"         # 00:00 / 01:00 / 02:00 МСК (пн)
    #
    # Остальные дни (пн / вт / сб): как раньше — 00:00, 01:00, 02:00 МСК
    - cron: "0 21-23 * * 1,2,6"
  workflow_dispatch:
    inputs:
      full:
        description: "Полная перезагрузка всей истории канала (медленнее)"
        type: boolean
        default: false
  push:
    branches: [main]         # передеплой сайта при изменениях кода

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Scrape, parse, aggregate
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            python scraper.py --full
          else
            python scraper.py
          fi
          python parser.py
          python aggregate.py

      # после полного прогона сохраняем БД в репозиторий,
      # иначе следующий инкрементальный запуск снова потеряет «дыры» в истории
      - name: Commit database after full scrape
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: |
          git config user.name "stats-bot"
          git config user.email "actions@github.com"
          git add frpoker.db
          git diff --cached --quiet || git commit -m "auto: full scrape refresh $(date -u +%F)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
