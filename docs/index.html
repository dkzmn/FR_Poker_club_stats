<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FR Poker Club — статистика</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --card: #161b27; --card2: #1c2333; --text: #e6e8ee;
    --muted: #8b93a7; --accent: #e0b34c; --green: #3fb96a; --line: #2a3142;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
  body { background: radial-gradient(1200px 600px at 50% -100px, #1a2438 0%, var(--bg) 60%); color: var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; width: 100%; }
  header { text-align: center; margin: 18px 0 26px; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: 1px; word-break: break-word; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
  .tabs button { background: var(--card); color: var(--text); border: 1px solid var(--line); padding: 9px 20px;
                 border-radius: 22px; cursor: pointer; font-size: 15px; }
  .tabs button.active { background: var(--accent); color: #14181f; border-color: var(--accent); font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  /* до ~1100px таблица сезона на всю ширину — иначе в половине сетки обрезаются колонки */
  @media (max-width: 1099px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
          min-width: 0; max-width: 100%; overflow: hidden; }
  .card h2 { margin: 0 0 14px; font-size: 17px; color: var(--accent); }
  .card.full { grid-column: 1 / -1; }
  .table-wrap { max-height: 420px; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
  .table-wrap.no-max { max-height: none; overflow-x: hidden; overflow-y: visible; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* компактные числовые колонки; таблица не растягивает ник на всю карточку */
  #lbTable { width: auto; max-width: 100%; }
  #lbTable th.num, #lbTable td.num { padding-left: 4px; padding-right: 4px; width: 1%; }
  #lbTable th:first-child, #lbTable td:first-child { width: 1%; white-space: nowrap; padding-right: 4px; }
  #lbTable th:nth-child(2), #lbTable td:nth-child(2) { padding-right: 10px; }
  /* игроки: таблица на ширину карточки, бейджи переносятся */
  #playersTable { width: 100%; }
  #playersTable td.badges-cell { white-space: normal; line-height: 1.5; }
  #playersTable td.badges-cell .badge { margin: 2px 3px 2px 0; }
  /* обе полосы с фоном — иначе «пустые» строки визуально кажутся уже/ниже */
  #lbTable td, #playersTable td {
    line-height: 1.35;
    background: rgba(255, 255, 255, 0.015);
  }
  #lbTable tbody tr:nth-child(even) td,
  #playersTable tbody tr:nth-child(even) td {
    background: rgba(255, 255, 255, 0.055);
  }
  tr.top1 td:first-child::before { content: "🥇 "; }
  tr.top2 td:first-child::before { content: "🥈 "; }
  tr.top3 td:first-child::before { content: "🥉 "; }
  tr.top1 td:first-child,
  tr.top2 td:first-child,
  tr.top3 td:first-child { white-space: nowrap; }
  .badge { display: inline-block; background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
           padding: 2px 9px; margin: 2px 3px 2px 0; font-size: 12.5px; white-space: nowrap; }
  .muted { color: var(--muted); }
  a.tg-post { color: var(--accent); text-decoration: none; font-size: 13px; margin-left: 4px; flex-shrink: 0; }
  a.tg-post:hover { text-decoration: underline; }
  details { border-bottom: 1px solid var(--line); }
  details summary { cursor: pointer; padding: 9px 4px; font-size: 14.5px; list-style: none; display: flex;
                    gap: 10px; flex-wrap: wrap; align-items: baseline; }
  details summary::before { content: "▸"; color: var(--muted); flex-shrink: 0; }
  details[open] summary::before { content: "▾"; }
  details table { margin: 4px 0 12px; }
  .champ { font-size: 15px; margin: -6px 0 14px; }
  .chartbox { position: relative; width: 100%; max-width: 100%; overflow: hidden; }
  @media (max-width: 600px) {
    .wrap { padding: 14px 8px 40px; }
    header h1 { font-size: 22px; }
    .card { padding: 13px 10px; }
    th, td { padding: 6px 4px; font-size: 12px; }
    th { font-size: 10px; }
    .tabs button { padding: 8px 14px; font-size: 14px; }
    .m-hide { display: none; }
    .badge { font-size: 11px; padding: 2px 7px; white-space: normal; max-width: 100%; }
    #playersTable { table-layout: fixed; width: 100%; }
    #playersTable th:first-child, #playersTable td:first-child { width: 26%; white-space: normal; word-break: break-word; }
    #playersTable th:nth-child(2), #playersTable td:nth-child(2),
    #playersTable th:nth-child(3), #playersTable td:nth-child(3) { width: 11%; }
    #playersTable th:nth-child(8), #playersTable td:nth-child(8) { width: 16%; }
    #playersTable th:last-child, #playersTable td:last-child { width: auto; overflow: hidden; }
  }
  #spadeUnlock { cursor: default; user-select: none; }
  .tabs button.calc-tab { display: none; }
  .tabs button.calc-tab.visible { display: inline-block; }
  .calc-row { display: grid; grid-template-columns: 52px 1fr 72px 88px; gap: 8px; align-items: center;
              margin-bottom: 8px; position: relative; }
  .calc-row.no-kills { grid-template-columns: 52px 1fr 88px; }
  .calc-row label { color: var(--muted); font-size: 13px; }
  .calc-controls { display: flex; flex-wrap: wrap; gap: 14px 20px; margin-bottom: 18px; align-items: end; }
  .calc-field { display: flex; flex-direction: column; gap: 5px; }
  .calc-field > span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .calc-field select, .calc-field input, .calc-row input, #calcOut {
    background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; font-family: inherit; }
  .calc-row input { width: 100%; min-width: 0; }
  .calc-suggest {
    position: absolute; left: 52px; right: 88px; top: 100%; z-index: 20; margin-top: 2px;
    background: var(--card2); border: 1px solid var(--line); border-radius: 8px; max-height: 180px;
    overflow-y: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .calc-row.no-kills .calc-suggest { right: 88px; }
  .calc-row.has-kills .calc-suggest { right: 168px; }
  .calc-suggest button {
    display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
    padding: 8px 12px; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .calc-suggest button:hover, .calc-suggest button.active { background: rgba(224, 179, 76, .18); }
  #calcOut { width: 100%; min-height: 320px; resize: vertical; line-height: 1.45; white-space: pre-wrap; }
  .calc-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .calc-actions button {
    background: var(--accent); color: #14181f; border: 0; border-radius: 8px; padding: 9px 16px;
    font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .calc-actions button.secondary { background: var(--card2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .calc-pts { text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 13px;
              white-space: nowrap; }
  .calc-row input[data-role=kills] { text-align: center; padding-left: 4px; padding-right: 4px; }
  @media (max-width: 600px) {
    .calc-row { grid-template-columns: 32px minmax(0, 1fr) 48px 56px; gap: 6px; }
    .calc-row.no-kills { grid-template-columns: 32px minmax(0, 1fr) 56px; }
    .calc-row input { padding: 7px 8px; font-size: 13px; }
    .calc-row input[data-role=kills] { padding: 7px 2px; font-size: 13px; }
    .calc-pts { font-size: 12px; }
    .calc-suggest { left: 32px; right: 56px; }
    .calc-row.no-kills .calc-suggest { right: 56px; }
    .calc-row.has-kills .calc-suggest { right: 110px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="spadeUnlock" title="">♠️</span> FR <span>Poker Club</span> — статистика</h1>
    <p id="meta"></p>
  </header>
  <div class="tabs" id="tabs"></div>

  <div class="grid" id="seasonView">
    <div class="card full">
      <h2 id="lbTitle">Лидерборд сезона</h2>
      <div class="champ" id="champ"></div>
      <div class="chartbox" id="lbBox"><canvas id="lbChart"></canvas></div>
    </div>
    <div class="card">
      <h2>Таблица сезона</h2>
      <div class="table-wrap"><table id="lbTable"></table></div>
    </div>
    <div class="card">
      <h2>Турниры сезона</h2>
      <div class="table-wrap" id="tournaments"></div>
    </div>
    <div class="card full">
      <h2>Гонка за титул — очки нарастающим итогом (топ-8)</h2>
      <div class="chartbox" id="raceBox"><canvas id="raceChart"></canvas></div>
    </div>
  </div>

  <div class="grid" id="playersView" style="display:none">
    <div class="card full">
      <h2>Игроки и достижения (за всё время)</h2>
      <div class="table-wrap no-max"><table id="playersTable"></table></div>
    </div>
  </div>

  <div class="grid" id="calcView" style="display:none">
    <div class="card full">
      <h2>Калькулятор очков → текст для Telegram</h2>
      <p class="muted" style="margin:-6px 0 16px;font-size:13px">Только генерация текста поста. Данные никуда не сохраняются.</p>
      <div class="calc-controls">
        <label class="calc-field">
          <span>Тип турнира</span>
          <select id="calcType"></select>
        </label>
        <label class="calc-field">
          <span>Игроков</span>
          <select id="calcN"></select>
        </label>
      </div>
      <div id="calcPlaces"></div>
      <h2 style="margin-top:22px">Текст для публикации</h2>
      <textarea id="calcOut" readonly spellcheck="false"></textarea>
      <div class="calc-actions">
        <button type="button" id="calcCopy">Скопировать</button>
        <button type="button" class="secondary" id="calcClear">Очистить имена</button>
      </div>
    </div>
  </div>
</div>

<script>
const PALETTE = ["#e0b34c","#4c9be0","#3fb96a","#e05c4c","#b46ce0","#4ce0d2","#e08d4c","#8ea3c7"];
let DATA, activeTab; // id сезона | "players" | "calc"
let calcUnlocked = sessionStorage.getItem("frCalcUnlock") === "1";

const SHARE_TABLE = {"4":[0.38,0.275,0.2,0.146],"5":[0.34,0.247,0.181,0.133,0.099],"6":[0.313,0.23,0.169,0.125,0.093,0.07],"7":[0.294,0.217,0.161,0.12,0.09,0.067,0.051],"8":[0.279,0.208,0.155,0.116,0.087,0.066,0.05,0.039],"9":[0.267,0.2,0.15,0.113,0.086,0.065,0.05,0.039,0.03],"10":[0.257,0.194,0.147,0.111,0.085,0.065,0.05,0.039,0.03,0.024],"11":[0.248,0.188,0.143,0.11,0.084,0.065,0.05,0.039,0.03,0.024,0.019],"12":[0.239,0.183,0.141,0.108,0.083,0.065,0.05,0.039,0.031,0.025,0.02,0.016],"13":[0.232,0.179,0.138,0.107,0.083,0.065,0.051,0.04,0.031,0.025,0.02,0.016,0.013],"14":[0.224,0.174,0.136,0.106,0.083,0.065,0.051,0.04,0.032,0.026,0.021,0.017,0.014,0.011],"15":[0.217,0.17,0.134,0.105,0.083,0.065,0.052,0.041,0.033,0.026,0.021,0.017,0.014,0.012,0.01],"16":[0.211,0.166,0.131,0.104,0.082,0.065,0.052,0.042,0.033,0.027,0.022,0.018,0.015,0.012,0.01,0.009],"17":[0.204,0.162,0.129,0.103,0.082,0.066,0.053,0.042,0.034,0.028,0.023,0.018,0.015,0.013,0.011,0.009,0.008],"18":[0.198,0.159,0.127,0.102,0.082,0.066,0.053,0.043,0.035,0.028,0.023,0.019,0.016,0.013,0.011,0.009,0.008,0.007],"19":[0.192,0.155,0.125,0.101,0.082,0.066,0.054,0.044,0.036,0.029,0.024,0.02,0.016,0.014,0.012,0.01,0.008,0.007,0.006],"20":[0.186,0.151,0.123,0.1,0.081,0.066,0.054,0.044,0.036,0.03,0.025,0.021,0.017,0.014,0.012,0.01,0.009,0.008,0.007,0.006]};

const TOURNAMENT_TYPES = [
  { id: "CLASSIC", label: "CLASSIC", title: "CLASSIC", m: 1, bounty: false },
  { id: "BOUNTY", label: "BOUNTY", title: "BOUNTY", m: 1, bounty: true },
  { id: "DEEPSTACK", label: "DEEPSTACK (×1.5)", title: "DEEPSTACK", m: 1.5, bounty: false },
  { id: "JOKER", label: "JOKER (×0.5)", title: "JOKER", m: 0.5, bounty: false },
  { id: "DOUBLE ROLL", label: "DOUBLE ROLL", title: "DOUBLE ROLL", m: 1, bounty: false },
  { id: "DOUBLE ROLL & VIEW CARD", label: "DOUBLE ROLL & VIEW CARD", title: "DOUBLE ROLL & VIEW CARD", m: 1, bounty: false },
  { id: "DOUBLE LIFE", label: "DOUBLE LIFE", title: "DOUBLE LIFE", m: 1, bounty: false },
  { id: "MAFIA", label: "MAFIA", title: "MAFIA", m: 1, bounty: false },
  { id: "ОБУЧЕНИЕ", label: "ОБУЧЕНИЕ", title: "ОБУЧЕНИЕ", m: 1, bounty: false },
];

const PLACE_MEDAL = { 1: "🥇", 2: "🥈", 3: "🥉" };

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name = k => DATA.player_names[k] || k;
const fmtDate = d => { const [y, m, dd] = d.split("-"); return `${dd}.${m}.${y.slice(2)}`; };

const round10 = x => Math.floor(x / 10 + 0.5) * 10;
function placePoints(n, place, m) {
  const share = SHARE_TABLE[String(n)][place - 1];
  return round10(round10(n * 1000 * share) * m);
}

function playerNameList() {
  return Object.values(DATA.player_names).sort((a, b) => a.localeCompare(b, "ru", { sensitivity: "base" }));
}

function filterPlayers(q) {
  const s = q.trim().toLowerCase();
  if (!s) return [];
  const all = playerNameList();
  const prefix = all.filter(n => n.toLowerCase().startsWith(s));
  const rest = all.filter(n => !n.toLowerCase().startsWith(s) && n.toLowerCase().includes(s));
  return [...prefix, ...rest].slice(0, 8);
}

fetch("data.json").then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById("meta").innerHTML =
    `Источник: <a href="https://t.me/${esc(d.channel)}" target="_blank" rel="noopener">${esc("t.me/" + d.channel)}</a> · обновлено ${new Date(d.generated_at).toLocaleString("ru-RU")}`;
  const tabs = document.getElementById("tabs");
  const addTab = (label, id, extraClass) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => { activeTab = id; render(); };
    b.dataset.tab = id;
    if (extraClass) b.className = extraClass;
    tabs.appendChild(b);
  };
  d.seasons.forEach(s => addTab(s.name, s.id));
  addTab("Игроки и достижения", "players");
  addTab("Калькулятор", "calc", "calc-tab" + (calcUnlocked ? " visible" : ""));
  activeTab = d.seasons[d.seasons.length - 1].id;
  setupSpadeUnlock();
  setupCalculator();
  renderPlayers();
  render();
});

function setupSpadeUnlock() {
  const el = document.getElementById("spadeUnlock");
  let clicks = 0;
  let timer = null;
  el.addEventListener("click", () => {
    if (calcUnlocked) return;
    clicks += 1;
    clearTimeout(timer);
    timer = setTimeout(() => { clicks = 0; }, 2500);
    if (clicks >= 7) {
      calcUnlocked = true;
      sessionStorage.setItem("frCalcUnlock", "1");
      document.querySelector(".tabs button.calc-tab")?.classList.add("visible");
      activeTab = "calc";
      render();
    }
  });
}

function currentType() {
  return TOURNAMENT_TYPES.find(t => t.id === document.getElementById("calcType").value) || TOURNAMENT_TYPES[0];
}

function setupCalculator() {
  const typeSel = document.getElementById("calcType");
  const nSel = document.getElementById("calcN");
  TOURNAMENT_TYPES.forEach(t => {
    const o = document.createElement("option");
    o.value = t.id; o.textContent = t.label;
    typeSel.appendChild(o);
  });
  for (let n = 4; n <= 20; n++) {
    const o = document.createElement("option");
    o.value = n; o.textContent = String(n);
    if (n === 8) o.selected = true;
    nSel.appendChild(o);
  }
  typeSel.onchange = rebuildCalcPlaces;
  nSel.onchange = rebuildCalcPlaces;
  document.getElementById("calcCopy").onclick = async () => {
    const text = document.getElementById("calcOut").value;
    try {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById("calcCopy");
      const prev = btn.textContent;
      btn.textContent = "Скопировано";
      setTimeout(() => { btn.textContent = prev; }, 1200);
    } catch {
      document.getElementById("calcOut").select();
      document.execCommand("copy");
    }
  };
  document.getElementById("calcClear").onclick = () => {
    document.querySelectorAll("#calcPlaces input[data-role=name]").forEach(i => { i.value = ""; });
    document.querySelectorAll("#calcPlaces input[data-role=kills]").forEach(i => { i.value = "0"; });
    updateCalcPreview();
  };
  rebuildCalcPlaces();
}

function rebuildCalcPlaces() {
  const n = +document.getElementById("calcN").value;
  const bounty = currentType().bounty;
  const box = document.getElementById("calcPlaces");
  const prev = {};
  box.querySelectorAll(".calc-row").forEach(row => {
    const p = row.dataset.place;
    prev[p] = {
      name: row.querySelector("input[data-role=name]")?.value || "",
      kills: row.querySelector("input[data-role=kills]")?.value || "0",
    };
  });
  box.innerHTML =
    `<div class="calc-row ${bounty ? "has-kills" : "no-kills"}" style="margin-bottom:4px">
       <label></label><label class="muted" style="font-size:11px;text-transform:uppercase">Игрок</label>
       ${bounty ? `<label class="muted" style="font-size:11px;text-transform:uppercase;text-align:center">☠️</label>` : ""}
       <label class="muted" style="font-size:11px;text-transform:uppercase;text-align:right">Очки</label>
     </div>` +
    Array.from({ length: n }, (_, i) => {
      const place = i + 1;
      const medal = PLACE_MEDAL[place] || String(place);
      const saved = prev[place] || {};
      return `<div class="calc-row ${bounty ? "has-kills" : "no-kills"}" data-place="${place}">
        <label>${medal}</label>
        <input data-role="name" type="text" autocomplete="off" spellcheck="false"
               placeholder="ник" value="${esc(saved.name || "")}">
        ${bounty ? `<input data-role="kills" type="number" min="0" max="${n}" value="${esc(saved.kills || "0")}">` : ""}
        <div class="calc-pts" data-role="pts">—</div>
        <div class="calc-suggest" hidden></div>
      </div>`;
    }).join("");

  box.querySelectorAll(".calc-row[data-place]").forEach(row => bindPlayerSuggest(row));
  box.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", updateCalcPreview);
    inp.addEventListener("change", updateCalcPreview);
  });
  updateCalcPreview();
}

function bindPlayerSuggest(row) {
  const input = row.querySelector("input[data-role=name]");
  const suggest = row.querySelector(".calc-suggest");
  let active = -1;

  const hide = () => { suggest.style.display = "none"; suggest.innerHTML = ""; active = -1; };
  const show = items => {
    if (!items.length) { hide(); return; }
    suggest.innerHTML = items.map((n, i) =>
      `<button type="button" data-i="${i}">${esc(n)}</button>`).join("");
    suggest.style.display = "block";
    suggest.removeAttribute("hidden");
    active = 0;
    [...suggest.children].forEach((b, i) => b.classList.toggle("active", i === active));
    suggest.querySelectorAll("button").forEach(btn => {
      btn.onmousedown = e => { e.preventDefault(); input.value = btn.textContent; hide(); updateCalcPreview(); };
    });
  };

  input.addEventListener("input", () => show(filterPlayers(input.value)));
  input.addEventListener("focus", () => { if (input.value.trim()) show(filterPlayers(input.value)); });
  input.addEventListener("blur", () => setTimeout(hide, 150));
  input.addEventListener("keydown", e => {
    const buttons = [...suggest.querySelectorAll("button")];
    if (!buttons.length) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      active = (active + 1) % buttons.length;
      buttons.forEach((b, i) => b.classList.toggle("active", i === active));
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      active = (active - 1 + buttons.length) % buttons.length;
      buttons.forEach((b, i) => b.classList.toggle("active", i === active));
    } else if (e.key === "Enter" && active >= 0) {
      e.preventDefault();
      input.value = buttons[active].textContent;
      hide();
      updateCalcPreview();
    } else if (e.key === "Escape") hide();
  });
}

function readCalcEntries() {
  const n = +document.getElementById("calcN").value;
  const type = currentType();
  const entries = [];
  document.querySelectorAll("#calcPlaces .calc-row[data-place]").forEach(row => {
    const place = +row.dataset.place;
    const pname = row.querySelector("input[data-role=name]")?.value.trim() || "";
    const kills = type.bounty
      ? Math.max(0, parseInt(row.querySelector("input[data-role=kills]")?.value, 10) || 0)
      : 0;
    const base = placePoints(n, place, type.m);
    const points = base + (type.bounty ? 100 * kills : 0);
    row.querySelector("[data-role=pts]").textContent = points;
    entries.push({ place, name: pname, kills, points, base });
  });
  return { n, type, entries };
}

function buildPostText({ type, entries }) {
  const lines = [`👑 ПОБЕДИТЕЛИ ТУРНИРА ${type.title}`, ""];
  entries.forEach(e => {
    const medal = PLACE_MEDAL[e.place] || String(e.place);
    const nick = e.name || "…";
    let line;
    if (type.bounty) {
      line = `${medal} ${nick}: ${e.kills} ☠️ - ${e.points}`;
    } else {
      line = `${medal} ${nick} - ${e.points}`;
      if (e.place === 1 && type.m === 1.5) line += " 💥";
    }
    lines.push(line);
  });
  if (type.bounty) {
    let hunter = null;
    entries.forEach(e => {
      if (!e.name) return;
      if (!hunter || e.kills > hunter.kills) hunter = e;
    });
    if (hunter && hunter.kills > 0) {
      lines.push("");
      lines.push(`🥊 Bounty Hunter турнира - ${hunter.name}: ${hunter.kills} 💀`);
    }
  }
  lines.push("");
  lines.push("📊 Лидерборд");
  lines.push("https://dkzmn.github.io/FR_Poker_club_stats/");
  lines.push("");
  lines.push("Спасибо большое всем участникам за игру, ждем вас на следующих турнирах 🔥");
  return lines.join("\n");
}

function updateCalcPreview() {
  const data = readCalcEntries();
  document.getElementById("calcOut").value = buildPostText(data);
}

let lbChart, raceChart;

function render() {
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === String(activeTab)));
  const isPlayers = activeTab === "players";
  const isCalc = activeTab === "calc";

  document.getElementById("playersView").style.display = isPlayers ? "" : "none";
  document.getElementById("calcView").style.display = isCalc ? "" : "none";
  if (isPlayers || isCalc) return;

  const s = DATA.seasons.find(x => x.id === activeTab);
  const lb = s.leaderboard;

  document.getElementById("champ").innerHTML = s.champion_key
    ? `🏆 Чемпион сезона: <b>${esc(name(s.champion_key))}</b>`
    : `<span class="muted">Сезон продолжается — финал ещё впереди</span>`;

  // --- бар-чарт лидерборда ---
  const mobile = window.innerWidth < 600;
  const top = lb.slice(0, 18);
  document.getElementById("lbTitle").textContent =
    `Лидерборд сезона — топ-${top.length} участников`;
  // высота под количество строк, иначе на узких экранах график сплющивается
  document.getElementById("lbBox").style.height = (top.length * (mobile ? 24 : 28) + 50) + "px";
  lbChart?.destroy();
  lbChart = new Chart(document.getElementById("lbChart"), {
    type: "bar",
    plugins: [ChartDataLabels],
    data: { labels: top.map(r => name(r.player_key)),
      datasets: [{ data: top.map(r => r.points), backgroundColor: top.map((_, i) =>
        i === 0 ? "#e0b34c" : i < 3 ? "#c7cbd6" : "#4c9be0"), borderRadius: 5 }] },
    options: { indexAxis: "y", maintainAspectRatio: false,
      layout: { padding: { right: mobile ? 42 : 56 } },
      plugins: { legend: { display: false },
        datalabels: { anchor: "end", align: "right", offset: 4, color: "#e6e8ee",
          font: { size: mobile ? 10 : 12, weight: 600 }, formatter: v => v.toLocaleString("ru-RU") } },
      scales: { x: { grid: { color: "#2a3142" }, ticks: { color: "#8b93a7" } },
                y: { grid: { display: false }, ticks: { color: "#e6e8ee", font: { size: mobile ? 11 : 13 } } } } }
  });

  // --- гонка нарастающим итогом ---
  const ts = DATA.tournaments.filter(t => t.season_id === activeTab && !t.is_final);
  const top8 = lb.slice(0, 8).map(r => r.player_key);
  const cum = Object.fromEntries(top8.map(k => [k, 0]));
  const series = Object.fromEntries(top8.map(k => [k, []]));
  ts.forEach(t => {
    t.results.forEach(r => { if (r.player_key in cum) cum[r.player_key] += r.points || 0; });
    top8.forEach(k => series[k].push(cum[k]));
  });
  document.getElementById("raceBox").style.height = (mobile ? 300 : 420) + "px";
  raceChart?.destroy();
  raceChart = new Chart(document.getElementById("raceChart"), {
    type: "line",
    data: { labels: ts.map(t => fmtDate(t.date)),
      datasets: top8.map((k, i) => ({ label: name(k), data: series[k], borderColor: PALETTE[i],
        backgroundColor: PALETTE[i], tension: .25, pointRadius: mobile ? 1.5 : 2.5,
        borderWidth: mobile ? 2 : 3 })) },
    options: { maintainAspectRatio: false,
      plugins: { legend: { labels: { color: "#e6e8ee", boxWidth: mobile ? 18 : 40,
        font: { size: mobile ? 11 : 12 } } } },
      scales: { x: { grid: { color: "#2a3142" }, ticks: { color: "#8b93a7",
                  maxTicksLimit: mobile ? 8 : 24, font: { size: mobile ? 10 : 12 } } },
                y: { grid: { color: "#2a3142" }, ticks: { color: "#8b93a7",
                  font: { size: mobile ? 10 : 12 } } } } }
  });

  // --- таблица сезона ---
  document.getElementById("lbTable").innerHTML =
    `<tr><th>#</th><th>Игрок</th><th class="num">Очки</th><th class="num">Игр</th>
     <th class="num">🥇</th><th class="num">🥈</th><th class="num">🥉</th><th class="num">💀</th>
     <th class="num m-hide">побед</th><th class="num m-hide">топ-3</th></tr>` +
    lb.map((r, i) =>
      `<tr class="top${i < 3 ? i + 1 : ""}"><td>${i + 1}</td><td>${esc(name(r.player_key))}</td>
       <td class="num">${r.points}</td><td class="num">${r.games}</td><td class="num">${r.wins}</td>
       <td class="num">${r.seconds}</td><td class="num">${r.thirds}</td>
       <td class="num">${r.kills}</td>
       <td class="num m-hide">${r.games ? Math.round(r.wins / r.games * 100) : 0}%</td>
       <td class="num m-hide">${r.games ? Math.round(r.podiums / r.games * 100) : 0}%</td></tr>`).join("");

  // --- турниры сезона ---
  const finals = DATA.tournaments.filter(t => t.season_id === activeTab && t.is_final);
  document.getElementById("tournaments").innerHTML = [...ts, ...finals].reverse().map(t => `
    <details>
      <summary><b>${fmtDate(t.date)}</b> ${esc(t.name || "Турнир")}${t.is_final ? " 🏆" : ""}
        <span class="muted">· ${t.results.length} игроков</span>
        <a class="tg-post" href="https://t.me/${esc(DATA.channel)}/${t.msg_id}" target="_blank" rel="noopener"
           onclick="event.stopPropagation()">пост</a></summary>
      <table>${t.results.map(r =>
        `<tr><td>${r.place}</td><td>${esc(name(r.player_key))}</td>
         <td class="num">${r.points ?? ""}</td><td class="num">${r.kills != null ? r.kills + " 💀" : ""}</td></tr>`).join("")}
      </table>
      ${t.bounty_hunter_key ? `<p class="muted" style="margin:0 0 10px">🥊 Bounty Hunter: ${esc(name(t.bounty_hunter_key))} (${t.bounty_hunter_kills} 💀)</p>` : ""}
    </details>`).join("");
}
